[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "triadlm"
version = "0.1.0"
description = "TriadLM: shared decoder-only LM with base / constitutional / grounded tracks"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy",
  "tokenizers>=0.15",
  "pyyaml",
  "tqdm",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
  "requests",
  "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["."]
include = ["triadlm*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
