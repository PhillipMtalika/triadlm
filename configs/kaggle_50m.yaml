# M1 validation on Kaggle free T4 (fp16 — T4 has no bf16).
# Same 8L/512 architecture as base_50m; step budget fits a 12h session.
# Corpus must grow ~1000x before a real M1 run (see notebook).
model:
  vocab_size: 8192
  block_size: 512
  n_layer: 8
  n_head: 8
  n_embd: 512
  dropout: 0.1
  bias: false
  tie_weights: true
train:
  batch_size: 16
  grad_accum_steps: 2
  max_steps: 500
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: fp16
  eval_interval: 100
  eval_iters: 20
  checkpoint_interval: 250
  seed: 1337
data:
  corpus_glob: "data/raw/*.txt"
  manifest: data/manifests/corpus_v1.json
  shard_dir: data/shards/corpus_v1
  train_split: 0.98
tokenizer:
  vocab_size: 8192
  save_dir: data/checkpoints/base_50m/tokenizer
run:
  out_dir: data/checkpoints/kaggle_50m
