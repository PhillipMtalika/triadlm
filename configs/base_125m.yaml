# Stretch goal: only after base_50m is stable (spec guardrail).
model:
  vocab_size: 8192
  block_size: 1024
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.1
  bias: false
  tie_weights: true
train:
  batch_size: 32
  grad_accum_steps: 8
  max_steps: 60000
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: bf16
  eval_interval: 1000
  eval_iters: 100
  checkpoint_interval: 2000
  seed: 1337
data:
  manifest: data/manifests/corpus_v1.json
  shard_dir: data/shards/corpus_v1
tokenizer:
  vocab_size: 8192
  save_dir: data/checkpoints/base_125m/tokenizer
run:
  out_dir: data/checkpoints/base_125m
