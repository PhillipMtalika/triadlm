# 125M-class on Kaggle free T4 (fp16). 12L/768, block 512 to fit 16GB.
# Same corpus_v2; capped steps fit one session. Real training, thin corpus (~0.3 tok/param).
model:
  vocab_size: 8192
  block_size: 512
  n_layer: 12
  n_head: 12
  n_embd: 768
  dropout: 0.1
  bias: false
  tie_weights: true
train:
  batch_size: 8
  grad_accum_steps: 4
  max_steps: 1500
  lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 100
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: fp16
  eval_interval: 250
  eval_iters: 20
  checkpoint_interval: 500
  seed: 1337
data:
  corpus_glob: "data/raw/*.txt"
  manifest: data/manifests/corpus_v2.json
  shard_dir: data/shards/corpus_v2
  train_split: 0.98
tokenizer:
  vocab_size: 8192
  save_dir: data/checkpoints/base_50m/tokenizer
run:
  out_dir: data/checkpoints/kaggle_125m
